{% extends 'base.html' %}
{% load static %}

{% block title %}Quên mật khẩu | E-Shopper{% endblock title %}

{% block content %}
<section id="form" style="margin-top: 0;">
    <div class="container">
        <div class="row">
            <div class="col-sm-6 col-sm-offset-1">
                <div class="login-form">
                    <h2>Khôi phục mật khẩu</h2>
                    <form method="POST">
                        {% csrf_token %}
                        <input type="email" name="email" required placeholder="Nhập email của bạn" style="margin-bottom: 15px;">
                        <button type="submit" class="btn btn-default" style="background: #FE980F; border: none; color: white;">Gửi link khôi phục</button>
                    </form>
                    <a href="{% url 'login' %}" style="display: block; margin-top: 15px;">Quay lại đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
