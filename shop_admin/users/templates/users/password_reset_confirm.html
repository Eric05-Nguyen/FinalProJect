{% extends 'base.html' %}
{% load static %}

{% block title %}Đặt mật khẩu mới | E-Shopper{% endblock title %}

{% block content %}
<section id="form" style="margin-top: 0;">
    <div class="container">
        <div class="row">
            <div class="col-sm-6 col-sm-offset-1">
                <div class="login-form">
                    {% if validlink %}
                        <h2>Đặt mật khẩu mới</h2>
                        <form method="POST">
                            {% csrf_token %}
                            <input type="password" name="new_password" required placeholder="Nhập mật khẩu mới" style="margin-bottom: 15px;">
                            <input type="password" name="confirm_password" required placeholder="Xác nhận mật khẩu mới" style="margin-bottom: 15px;">
                            <button type="submit" class="btn btn-default" style="background: #FE980F; border: none; color: white;">Xác nhận đổi</button>
                        </form>
                    {% else %}
                        <h2 style="color: red;">Lỗi!</h2>
                        <p>Đường link không hợp lệ hoặc đã hết hạn.</p>
                        <a href="{% url 'forgot_password' %}" style="display: block; margin-top: 15px; color: #FE980F;">Thử lại</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
