{% extends 'base.html' %}
{% load static %}
{% block title %} Add Product | E -Shopee {% endblock title %}

{% block content %}
<style>
    .simple-form-container {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        max-width: 800px;
        margin: 20px auto;
        background: #fff;
    }
    .simple-form-container h2 {
        color: #888;
        font-size: 24px;
        margin-bottom: 20px;
        font-weight: normal;
    }
    .simple-input {
        width: 100%;
        padding: 15px;
        margin-bottom: 10px;
        background-color: #f2f2f2;
        border: 1px solid #e8e8e8;
        color: #777;
        box-sizing: border-box;
        font-size: 14px;
    }
    .simple-input::placeholder {
        color: #aaa;
    }
    select.simple-input {
        appearance: auto;
        color: #aaa;
    }
    
    .sale-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }
    .sale-row input {
        width: 100px;
        padding: 15px;
        background-color: #f2f2f2;
        border: 1px solid #e8e8e8;
        margin-right: 10px;
        color: #777;
    }
    
    .file-upload-row {
        background-color: #f2f2f2;
        border: 1px solid #e8e8e8;
        padding: 10px;
        margin-bottom: 10px;
        color: #aaa;
    }
    
    .file-upload-row input[type="file"] {
        color: #555;
    }

    textarea.simple-input {
        min-height: 150px;
        resize: vertical;
    }
    .submit-btn {
        background-color: #fe980f;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }
    .submit-btn:hover {
        background-color: #e5870b;
    }
</style>

<div class="blog-post-area">
    <div class="simple-form-container">
        <h2>Create product!</h2>

        <form id="productAjax" action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="name">Name</label>
            <input type="text" name="name" class="simple-input" placeholder="Name">
            <p id="error-name" style="color: red;"></p> 
            <br>
            <label for="price">Price</label>
            <input type="number" name="price" step="any" class="simple-input" placeholder="Price">
            <p id="error-price" style="color: red;"></p>
            <br>
            <label for="id_category">Category</label>
            <select name="id_category" class="simple-input">
                <option value="" disabled selected>Please choose category</option>
                {% for category in categories %}
                <option value="{{category.id}}">{{category.name}}</option>
                {% endfor %}
            </select>
            <p id="error-category" style="color: red;"></p>
            <br>
            <label for="id_brand">Brand</label>
            <select name="id_brand" class="simple-input">
                <option value="" disabled selected>Please choose brand</option>
                {% for brand in brands %}
                <option value="{{brand.id}}">{{brand.name}}</option>
                {% endfor %}
            </select>
            <p id="error-brand" style="color: red;"></p>
            <br>
            <label for="productStatus">Status</label>
            <select name="state" id="productStatus" class="simple-input">
                <option value="0" selected>New</option>
                <option value="1">Sale</option>
            </select>
            <p id="error-status" style="color: red;"></p>

            <div id="salePercentageDiv" style="display: none;">
                <div class="sale-row">
                    <input type="number" name="sale_percentage" id="saleInput" min="0" max="100" placeholder="0"> 
                    <span style="color: #777;">%</span>
                </div>
            </div>
            <p id="error-sale_percentage" style="color: red;"></p>
            <br>
            <label for="company_profile">Company profile</label>
            <input type="text" name="company_profile" class="simple-input" placeholder="Company profile">
            <p id="error-company_profile" style="color: red;"></p>
            <br>
            <label for="image">Image</label>
            <div class="file-upload-row">
                <input type="file" name="image" multiple accept="image/*">
            </div>
            <p id="error-image" style="color: red;"></p>
            <br>
            <label for="description">Description</label>
            <textarea name="description" class="simple-input" placeholder="Detail"></textarea>
            <p id="error-description" style="color: red;"></p>
            <button type="submit" class="submit-btn">Create product</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const statusSelect = document.getElementById('productStatus');
        const saleDiv = document.getElementById('salePercentageDiv');
        const saleInput = document.getElementById('saleInput');

        statusSelect.addEventListener('change', function() {
            if (this.value === '1') {
                saleDiv.style.display = 'block'; 
                saleInput.required = true; 
            } else {
                saleDiv.style.display = 'none'; 
                saleInput.value = '';
                saleInput.required = false;
            }
        });
    });
</script>
{% endblock content %}

{% block scripts %}
    <script>
        $('#productAjax').submit(function(e){
            e.preventDefault();
            const formData= new FormData(this);
            $.ajax({
                url:'{% url "add_product" %}',
                type:'POST',
                data:formData,
                processData:false,  // Để không xử lý dât thành query string
                contentType:false, // Để không set header content type (để trình duyệt tự set multipart/form-data )
                headers:{
                    'X-CSRFToken':'{{csrf_token}}'
                },
                success:function(data){
                    if (data.status === 'success') {
                        alert(data.message);
                        window.location.reload(); 
                    } else {
                        
                        if(data.errors) {
                            $('#error-name').text(data.errors.name||'');
                            $('#error-price').text(data.errors.price||'');
                            $('#error-category').text(data.errors.category||'');
                            $('#error-brand').text(data.errors.brand||'');
                            $('#error-status').text(data.errors.status||'');
                            $('#error-sale_percentage').text(data.errors.sale_percentage||'');
                            $('#error-company_profile').text(data.errors.company_profile||'');
                            $('#error-image').text(data.errors.image||'');
                            $('#error-description').text(data.errors.description||'');
                        }
                    }
                },
                error:function(xhr){
                    var errorTitle = "";
                    try {
                        errorTitle = $(xhr.responseText).filter('title').text() || $(xhr.responseText).find('title').text();
                    } catch(e) {}
                    alert("LỖI NGẦM TRONG BACKEND!\nMã lỗi: " + xhr.status + "\nChi tiết: " + (errorTitle || "Không rõ"));
                    
                    if(xhr.responseJSON && xhr.responseJSON.errors) {
                        $('#error-name').text(xhr.responseJSON.errors.name||'');
                        $('#error-price').text(xhr.responseJSON.errors.price||'');
                        $('#error-category').text(xhr.responseJSON.errors.category||'');
                        $('#error-brand').text(xhr.responseJSON.errors.brand||'');
                        $('#error-status').text(xhr.responseJSON.errors.status||'');
                        $('#error-sale_percentage').text(xhr.responseJSON.errors.sale_percentage||'');
                        $('#error-company_profile').text(xhr.responseJSON.errors.company_profile||'');
                        $('#error-image').text(xhr.responseJSON.errors.image||'');
                        $('#error-description').text(xhr.responseJSON.errors.description||'');
                    }
                }
            })
        })
    </script>

{% endblock %}
